name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Se enviou só o zip, extrai o projeto
      - name: Extrair projeto
        run: |
          if [ -f HoloMind-android.zip ]; then unzip -q -o HoloMind-android.zip; fi
          if [ -d HoloMind ]; then echo "PROJ=HoloMind" >> $GITHUB_ENV; else echo "PROJ=." >> $GITHUB_ENV; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: |
          set -o pipefail
          cd "$PROJ"
          gradle assembleRelease --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Resumo do erro (aparece em Annotations e no Summary)
        if: failure()
        run: |
          ERR=$(grep -E "^e: |What went wrong|Could not |Execution failed|Unresolved" -A2 "$GITHUB_WORKSPACE/build.log" | head -14)
          echo "$ERR"
          {
            echo '### Erro de compilação'
            echo '```'
            echo "$ERR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          MSG=$(echo "$ERR" | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Erro de compilação::$MSG"

      - name: Verificar que o APK contém o modelo de voz
        run: |
          cd "$PROJ"
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          unzip -l "$APK" | grep -Eq "assets/model-pt/(am/)?final.mdl" || { echo "ERRO: o APK não contém o modelo de voz"; exit 1; }
          echo "OK: modelo de voz embutido no APK"
          if unzip -l "$APK" | grep -Eq "assets/model-en/(am/)?final.mdl"; then echo "OK: modelo inglês embutido"; else echo "AVISO: sem modelo inglês (o app funciona só em português)"; fi

      - name: Testes unitários (não bloqueiam o APK)
        continue-on-error: true
        run: |
          cd "$PROJ"
          gradle testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: HoloMind-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/app-release.apk

      - name: Publicar em Releases (download direto no telemóvel)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HoloMind build ${{ github.run_number }}
          files: ${{ env.PROJ }}/app/build/outputs/apk/release/app-release.apk
