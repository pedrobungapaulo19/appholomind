name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Se enviou só o zip, extrai o projeto
      - name: Extrair projeto
        run: |
          if [ -f HoloMind-android.zip ]; then unzip -q -o HoloMind-android.zip; fi
          if [ -d HoloMind ]; then echo "PROJ=HoloMind" >> $GITHUB_ENV; else echo "PROJ=." >> $GITHUB_ENV; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Modelo de voz (Vosk português)
        run: |
          cd "$PROJ"
          mkdir -p app/src/main/assets/model-pt
          curl -L -o /tmp/m.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q /tmp/m.zip -d /tmp/m
          cp -r /tmp/m/*/* app/src/main/assets/model-pt/
          ls app/src/main/assets/model-pt

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: |
          cd "$PROJ"
          gradle assembleDebug --stacktrace

      - name: Testes unitários (não bloqueiam o APK)
        continue-on-error: true
        run: |
          cd "$PROJ"
          gradle testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: HoloMind-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar em Releases (download direto no telemóvel)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HoloMind build ${{ github.run_number }}
          files: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
